server {
    # Listen on port 80 (HTTP)
    listen 80;
    server_name localhost;

    # Root directory where frontend production build static files are located
    root /usr/share/nginx/html;

    # Default document to serve
    index index.html;

    # Gzip Compression
    # Enable gzip compression to reduce file transfer sizes and improve load speeds
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # Compress standard text, stylesheet, and javascript files
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets (JS/CSS, images, fonts, media)
    # Since Vite build uses hash-fingerprinted filenames (e.g., index-A7b9d4.js),
    # these files are immutable and can be cached aggressively for 1 year (31536000 seconds).
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router single-page application (SPA) routing support
    # Try serving the request URI as a file first, then as a directory.
    # If neither exists, fallback to serve index.html (allowing React Router to handle client-side routing).
    # Return 404 only if index.html itself is missing.
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
