# Main Nginx Reverse Proxy Configuration for SchemaForge Production
# This proxy handles client connections, applies security measures, compresses responses,
# and forwards traffic to either the React frontend or the Express API backend.

# Events block configures network connections handling
events {
    # Maximum number of simultaneous connections that can be opened by a worker process
    worker_connections 1024;
}

# HTTP block containing configurations for web traffic handling
http {
    # ==========================================
    # GZIP COMPRESSION CONFIGURATION
    # ==========================================
    # Enable Gzip compression at the proxy level to reduce payload size and speed up page loads
    gzip on;
    # Compress standard text, JSON, and JavaScript assets
    gzip_types text/plain text/css application/json application/javascript text/xml;
    # Only compress responses that are larger than 1000 bytes
    gzip_min_length 1000;

    # ==========================================
    # SECURITY SETTINGS
    # ==========================================
    # Do not reveal the Nginx version number in error pages or response headers for security hardening
    server_tokens off;

    # ==========================================
    # UPSTREAM DEFINITIONS (DOCKER SERVICE ROUTING)
    # ==========================================
    # Backend upstream pointing to the Express server service defined in Docker Compose
    upstream backend {
        server backend:4000;
    }

    # Frontend upstream pointing to the built SPA Nginx container
    upstream frontend {
        server frontend:80;
    }

    # ==========================================
    # SERVER BLOCK (PORT 80 HTTP)
    # ==========================================
    server {
        # Listen on port 80 (HTTP) inside the proxy container
        listen 80;
        server_name localhost;

        # ==========================================
        # GLOBAL SECURITY HEADERS
        # ==========================================
        # Prevent clickjacking attacks by ensuring pages cannot be embedded in frames on other sites
        add_header X-Frame-Options "SAMEORIGIN";
        # Prevent MIME type sniffing attacks by telling the browser to stick to declared content types
        add_header X-Content-Type-Options "nosniff";
        # Enable the browser's built-in XSS protection and block execution if an attack is detected
        add_header X-XSS-Protection "1; mode=block";

        # ==========================================
        # CLIENT BODY SIZE LIMIT
        # ==========================================
        # Increase maximum upload file size to 10MB to accommodate large schema file uploads
        client_max_body_size 10M;

        # ==========================================
        # API ROUTING (→ EXPRESS BACKEND)
        # ==========================================
        # Proxy all /api/ requests to the backend Express server
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Forward original request headers to the backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Configure connection timeouts
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ==========================================
        # WEBSOCKET ROUTING (→ EXPRESS SOCKET.IO)
        # ==========================================
        # Proxy WebSocket connections for real-time collaboration to the backend Socket.IO server
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Enable protocol upgrade headers for WebSocket handshake
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Forward client identifiers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Bypass Nginx caching for real-time traffic
            proxy_cache_bypass $http_upgrade;
            # Keep connections open for up to 24 hours (86400s) to prevent unwanted timeouts
            proxy_read_timeout 86400s;
        }

        # ==========================================
        # FRONTEND ROUTING (→ REACT SPA)
        # ==========================================
        # Forward all other requests to the frontend React container
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            # Forward host and real client IP headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ==========================================
        # PROXY HEALTH CHECK
        # ==========================================
        # Simple health check endpoint for container orchestration platforms and monitoring tools
        location /nginx-health {
            return 200 'nginx ok';
            add_header Content-Type text/plain;
        }
    }
}
